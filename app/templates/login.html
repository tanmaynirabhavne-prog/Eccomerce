<p class="font-body-md text-on-surface-variant">Enter your credentials to access your curated style profile.</p>

<form class="space-y-gutter" id="loginForm">
<!-- Email Field -->
<div class="group">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant block mb-2 transition-colors group-focus-within:text-primary" for="email">Email Address</label>
<input class="w-full border-0 border-b border-outline-variant bg-transparent py-3 px-0 font-body-md text-primary placeholder:text-outline-variant transition-all focus:ring-0" id="email" name="email" placeholder="alexander@vogue.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="group">
<div class="flex justify-between items-center mb-2">
<label class="font-label-sm text-label-sm uppercase text-on-surface-variant transition-colors group-focus-within:text-primary" for="password">Password</label>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary underline transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full border-0 border-b border-outline-variant bg-transparent py-3 px-0 font-body-md text-primary placeholder:text-outline-variant transition-all focus:ring-0" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Remember Me -->
<div class="flex items-center space-x-3">
<input class="w-5 h-5 rounded-none border-outline text-primary focus:ring-0 focus:ring-offset-0" id="remember" name="remember" type="checkbox"/>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="remember">Remember me for 30 days</label>
</div>
<p id="login-error" class="login-error"></p>

                    </button>

                        <a class="text-primary font-bold hover:underline transition-all" href="/register">Create account</a>
</p>

<!-- Adjust this path to wherever your project actually serves api.js -->
<script src="/static/js/api.js"></script>
<script>
        // Micro-interactions for input focus effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label')?.classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label')?.classList.remove('text-primary');
            });
        });

        // Login -> POST /auth/login (via loginUser() in api.js) -> redirect to /home
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnLabel = document.getElementById('loginBtnLabel');
        const loginError = document.getElementById('login-error');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.remove('show');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                loginError.textContent = 'Please enter both email and password.';
                loginError.classList.add('show');
                return;
            }

            loginBtn.disabled = true;
            loginBtnLabel.textContent = 'Logging in...';

            try {
                await loginUser({ email, password });
                window.location.href = '/home';
            } catch (err) {
                console.error('Login failed:', err);
                loginError.textContent = err.message || 'Invalid email or password.';
                loginError.classList.add('show');
                loginBtn.disabled = false;
                loginBtnLabel.textContent = 'Login to Account';
            }
        });
    </script>
