<section class="w-full lg:w-1/2 h-full bg-surface-container-lowest flex flex-col overflow-y-auto px-margin-mobile md:px-margin-desktop py-12 relative">
<!-- Branding -->

<a class="font-label-lg text-label-lg text-primary border-b border-primary hover:opacity-70 transition-opacity" href="/login">Login</a>
</div>
<!-- Form Content -->
<div class="max-w-md mx-auto w-full my-auto fade-in-up" style="animation-delay: 0.2s;">
<header class="mb-10">
<h2 class="font-headline-lg text-headline-lg mb-2">Create Account</h2>

</header>
<form class="space-y-8" id="registerForm">
<div class="space-y-6">
<div class="relative">
<label class="font-label-sm text-label-sm uppercase tracking-widest text-on-surface-variant block mb-1" for="fullname">Full Name</label>
<input class="form-input w-full py-2 font-body-md" id="fullname" placeholder="Enter your full name" type="text"/>

<div class="relative">

<input class="form-input w-full py-2 font-body-md" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>

                        </label>
</div>
<button class="btn-primary w-full bg-primary text-on-primary font-label-lg text-label-lg uppercase tracking-widest py-5 flex justify-center items-center gap-2 group" id="registerBtn" type="submit">

</button>

<!-- Adjust this path to wherever your project actually serves api.js -->
<script src="/static/js/api.js"></script>
<script>
        // Micro-interactions for form focus
        document.querySelectorAll('.form-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-primary');
                input.parentElement.querySelector('label').classList.remove('text-on-surface-variant');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-primary');
                input.parentElement.querySelector('label').classList.add('text-on-surface-variant');
            });
        });

        // Create Account -> POST /auth/register (via registerUser() in api.js) -> stored in users table
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const registerBtnLabel = document.getElementById('registerBtnLabel');
        const registerError = document.getElementById('register-error');

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            registerError.classList.remove('show');

            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const termsAccepted = document.getElementById('terms').checked;

            if (!fullname || !email || !password || !confirmPassword) {
                registerError.textContent = 'Please fill in all fields.';
                registerError.classList.add('show');
                return;
            }
            if (password !== confirmPassword) {
                registerError.textContent = 'Passwords do not match.';
                registerError.classList.add('show');
                return;
            }
            if (!termsAccepted) {
                registerError.textContent = 'Please agree to the Terms of Service and Privacy Policy.';
                registerError.classList.add('show');
                return;
            }

            registerBtn.disabled = true;
            registerBtnLabel.textContent = 'Creating Account...';

            try {
                // Backend's UserCreate schema expects: username, email, password
                await registerUser({
                    username: fullname,
                    email: email,
                    password: password,
                });

                window.location.href = '/login';
            } catch (err) {
                console.error('Registration failed:', err);
                registerError.textContent = err.message || 'Could not create account. Please try again.';
                registerError.classList.add('show');
            } finally {
                registerBtn.disabled = false;
                registerBtnLabel.textContent = 'Create Account';
            }
        });
    </script>
