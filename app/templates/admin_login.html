<!DOCTYPE html>
<html>
<head><title>Admin Login</title></head>
<body style="font-family: sans-serif; max-width: 400px; margin: 100px auto;">
  <h2>Admin Login</h2>
  {% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
  <form method="post" action="/admin/login">
    <input type="password" name="password" placeholder="Admin password" style="width:100%;padding:8px;margin-bottom:10px;box-sizing:border-box;" required>
    <button type="submit" style="width:100%;padding:8px;">Login</button>
  </form>
</body>
</html>
